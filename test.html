<!DOCTYPE html>
<html>
<head>
    <title>Fake News Detection</title>

    <!-- CSS File Link -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <div class="card">

            <div class="icon">📰</div>

            <h1>Fake News Detection</h1>

            <p class="subtitle">
                Detect whether a news article is Real or Fake using Machine Learning
            </p>

            <textarea
                id="newsText"
                placeholder="Enter news text here">
            </textarea>

            <button onclick="checkNews()" id="checkButton">
                🔍 Check News
            </button>

            <div id="result" class="result"></div>

        </div>

        <p class="footer">
            Powered by Machine Learning • TF-IDF • Logistic Regression
        </p>

    </div>


    <script>
        async function checkNews() {

            const text = document.getElementById("newsText").value;
            const result = document.getElementById("result");
            const button = document.getElementById("checkButton");

            if (text.trim() === "") {

                result.innerText = "⚠️ Please enter news text.";
                result.className = "result warning";
                return;
            }

            result.innerText = "⏳ Checking news...";
            result.className = "result loading";

            button.disabled = true;

            try {

                const response = await fetch(
                    "/predict",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            text: text
                        })
                    }
                );

                const data = await response.json();

                if (data.prediction === "Fake News") {

                    result.innerText = "❌ Fake News";
                    result.className = "result fake";

                } else {

                    result.innerText = "✅ Real News";
                    result.className = "result real";

                }

            } catch (error) {

                result.innerText = "⚠️ Backend connection error.";
                result.className = "result warning";

                console.log(error);
            }

            button.disabled = false;
        }
    </script>

</body>
</html>
